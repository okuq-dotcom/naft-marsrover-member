<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#111820">
  <title>ステータスメーカー｜NAFT Mars Rover</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='27' fill='white' stroke='%23111820' stroke-width='5'/%3E%3Cpath d='M32 12 51 39 32 34 24 51 17 33Z' fill='%23ff6500'/%3E%3C/svg%3E">
  <style>
    :root{font-family:Inter,"Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;color:#111820;background:#eef0f2;font-synthesis:none}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#eef0f2}button,input{font:inherit}button{cursor:pointer}
    [hidden]{display:none!important}

    .top{background:#111820;color:#f8f8f7;padding:28px 16px 26px}
    .top-inner,.main{max-width:720px;margin:0 auto}
    .eyebrow{font-size:12px;letter-spacing:.18em;font-weight:800;color:#ff7a21;margin:0 0 6px}
    .top h1{font-size:27px;letter-spacing:-.03em;margin:0;line-height:1.3}
    .intro{font-size:14px;line-height:1.65;color:#bec5cc;margin:8px 0 0}
    .main{padding:24px 16px 48px}

    .card{background:#fff;border:1px solid #d5dade;border-radius:16px;box-shadow:0 20px 55px #1e303914;padding:24px 22px}
    .btn{height:47px;padding:0 20px;border-radius:10px;border:0;font-weight:800;background:#ff6500;color:#111820}
    .btn:hover:not(:disabled){background:#ff842e}.btn:disabled{opacity:.4;cursor:not-allowed}
    .btn.sub{background:#35414b;color:#eff2f3}.btn.sub:hover{background:#45515b}
    .btn-row{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.btn-row .btn{flex:1 1 150px}
    .rule{font-size:13px;color:#4b565f;line-height:1.7;margin:18px 0 0;padding:14px 16px;background:#f4f6f7;border-radius:10px}
    .rule b{color:#111820}

    /* 質問 */
    .progress{height:5px;background:#e1e5e8;border-radius:3px;overflow:hidden;margin-bottom:16px}
    .progress>div{height:100%;background:#ff6500;transition:width .25s}
    .q-meta{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:#677178}
    .q-ability{font-weight:800;color:#e05a00}
    .q-name{font-size:21px;font-weight:800;margin:6px 0 4px;letter-spacing:-.02em}
    .q-desc{font-size:15px;color:#3d4851;line-height:1.65;margin:0 0 18px}
    .choices{display:grid;gap:8px}
    .choice{display:grid;grid-template-columns:52px 1fr;align-items:center;gap:12px;text-align:left;padding:12px 14px;border:1px solid #d5dade;border-radius:10px;background:#fff;color:#111820;transition:border-color .15s,background .15s}
    .choice:hover,.choice:focus-visible{border-color:#ff7a21;background:#fff5ee;outline:none}
    .choice.selected{border-color:#ff6500;background:#fff1e6}
    .choice-score{font-weight:800;font-size:15px;text-align:center;border-radius:8px;background:#111820;color:#fff;padding:6px 0;line-height:1.2}
    .choice-score small{display:block;font-size:11px;font-weight:700;color:#ff9a55}
    .choice-text{font-size:14px;line-height:1.55}
    .back{margin-top:16px;background:none;border:0;color:#677178;padding:0;font-size:14px}.back:hover{color:#111820}

    /* 結果 */
    .paper{width:100%;aspect-ratio:1;background:#fff;border:1px solid #d5dade;border-radius:18px;box-shadow:0 20px 55px #1e303914;padding:18px;display:grid;place-items:center}
    .paper svg{width:100%;height:100%;display:block}
    table{width:100%;border-collapse:collapse;margin-top:20px;font-size:14px}
    th,td{padding:10px 12px;border-bottom:1px solid #e1e5e8;text-align:left}
    th{font-size:12px;color:#677178;font-weight:700}
    td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
    td.grade{font-weight:800;font-size:16px;text-align:center;width:4em}
    .detail{color:#677178;font-size:12px;display:block;margin-top:2px}
    .message{font-size:13px;min-height:18px;color:#c05000;margin:10px 0 0}
    .home{display:inline-block;margin-top:24px;color:#677178;font-size:14px}

    @media(max-width:520px){.top h1{font-size:23px}.card{padding:20px 16px}.paper{padding:8px;border-radius:12px}.choice{grid-template-columns:46px 1fr;gap:10px;padding:11px 12px}}
  </style>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <p class="eyebrow">NAFT · MARS ROVER PROJECT</p>
      <h1>ステータスメーカー</h1>
      <p class="intro">チームメンバー能力判定票の質問に答えると、あなたのステータス図ができあがります。</p>
    </div>
  </header>

  <main class="main">
    <!-- 開始 -->
    <section class="card" id="start">
      <p class="rule" style="margin-top:0">全<b id="totalCount"></b>問。各要素を<b>0〜4点</b>で答えると、能力ごとの平均点から<b>A〜E</b>の評価が決まります（成長性は1〜4点で<b>A〜D</b>）。</p>
      <div class="btn-row"><button class="btn" id="startBtn" type="button">判定スタート</button></div>
    </section>

    <!-- 質問 -->
    <section class="card" id="quiz" hidden>
      <div class="progress"><div id="progressBar"></div></div>
      <div class="q-meta"><span class="q-ability" id="qAbility"></span><span id="qCount"></span></div>
      <div class="q-name" id="qName"></div>
      <p class="q-desc" id="qDesc"></p>
      <div class="choices" id="choices"></div>
      <button class="back" id="backBtn" type="button">← ひとつ戻る</button>
    </section>

    <!-- 結果 -->
    <section id="result" hidden>
      <div class="paper"><svg id="chart" viewBox="0 0 600 600" role="img" aria-label="ステータス図" xmlns="http://www.w3.org/2000/svg"></svg></div>
      <div class="card" style="margin-top:16px">
        <table>
          <thead><tr><th>能力</th><th class="num">点数・平均点</th><th style="text-align:center">評価</th></tr></thead>
          <tbody id="rTable"></tbody>
        </table>
        <div class="btn-row">
          <button class="btn" id="downloadBtn" type="button">PNGで保存</button>
          <button class="btn sub" id="copyBtn" type="button">結果をコピー</button>
          <button class="btn sub" id="retryBtn" type="button">もう一度</button>
        </div>
        <p class="message" id="message" role="status" aria-live="polite"></p>
      </div>
    </section>

    <a class="home" href="./">← メンバーページに戻る</a>
  </main>

  <script>
  (()=>{
    // ── 判定票の内容 ─────────────────────────────
    const COMMON = [
      '取り組んでも、基本的な作業をまだ行えない',
      '基本の一部はできるが、継続的な支援が必要',
      '助言を受ければできる',
      '自力で一通りできる',
      '自力で高い水準まででき、改善や他のメンバーへの助言もできる',
    ];
    const ABILITIES = [
      { name: '構造力', items: [
        { n: 'CAD能力', d: '寸法や組み立てを考慮して、部品や機体のモデル・図面を作れるか' },
        { n: '加工能力', d: '図面に沿って安全に加工・組み立てを行い、精度を確認できるか' },
        { n: '部品・材料選定能力', d: '強度、重量、費用、入手性などを考えて選定し、理由を説明できるか' },
      ]},
      { name: '制御力', items: [
        { n: 'プログラミング能力', d: '必要な動作を実装し、試験と不具合修正ができるか' },
        { n: '制御全体の設計能力', d: 'センサー、判断、動作のつながりを整理し、機体全体の制御を設計できるか' },
      ]},
      { name: '電装力', items: [
        { n: '回路・電源の理解', d: '回路図を読み、電圧・電流・電源容量を確認できるか' },
        { n: '配線・実装能力', d: '安全で整備しやすい配線や接続を行えるか' },
        { n: '検査・故障対応能力', d: '測定器を使って動作を確認し、不具合の原因を絞り込めるか' },
      ]},
      { name: '科学力', items: [
        { n: 'Astrobiologyの理解', d: '何を生命の兆候や生存可能な環境の手がかりとして調べるのか、その理由を説明できるか' },
        { n: '検出方法の設計', d: '調べたい対象に合うセンサーや実験方法を選び、測定手順と比較方法を考えられるか' },
        { n: '結果の解釈', d: 'データを整理し、測定誤差や別の説明も考えたうえで、結果から言えることを判断できるか' },
      ]},
      { name: 'マネジメント力', items: [
        { n: 'スポンサー対応', d: '活動の目的や必要な支援を説明し、提案・報告・お礼など適切な対応ができるか' },
        { n: 'メール・対外連絡', d: '相手と目的に合った文面を作り、期限を意識して連絡・返信できるか' },
        { n: 'チームマネジメント', d: '目標、役割、期限、進捗を整理し、問題が起きたときに調整できるか' },
      ]},
      { name: 'ローバー操作能力', items: [
        { n: '基本操作・正確性', d: '操作手順を守り、指定した経路や作業を正確に実行できるか' },
        { n: '状況判断・安全対応', d: '周囲や機体の状態を見て操作を調整し、異常時に安全に停止できるか' },
      ]},
      { name: '英語力', items: [
        { n: 'Reading', d: '英文をどの程度理解できるか', c: [
          '基本的な単語の理解が難しい',
          '基本的な単語や短い表現を理解できる',
          '短く簡単な文章を理解できる',
          '身近な話題の文章を自力で理解できる',
          '自分が取り組む難しい内容について、英語の資料を正確に理解できる',
        ]},
        { n: 'Speaking', d: '英語でどの程度伝えられるか', c: [
          '簡単な受け答えが難しい',
          '単語や決まった表現で伝えられる',
          '簡単な質問に短い文で答えられる',
          '身近な話題について、自分の言葉で会話できる',
          '自分が取り組む難しい内容を説明し、質問にも答えられる',
        ]},
        { n: 'Listening', d: '話された英語をどの程度理解できるか', c: [
          '基本的な単語の聞き取りが難しい',
          '基本的な単語や短い表現を聞き取れる',
          'ゆっくり話された簡単な内容を理解できる',
          '身近な話題の会話を理解できる',
          '自分が取り組む難しい内容についての説明や質問を理解できる',
        ]},
      ]},
      { name: '成長性', growth: true, items: [
        { n: 'やる気', d: '本人が活動に取り組みたいと思っているか', c: [
          null,
          '今はやる気が出ない',
          '今はあまりやる気が出ないが、続けたい',
          'やる気に波がある',
          'やる気がある',
        ]},
      ]},
    ];
    const GROWTH_GRADE = { 4: 'A', 3: 'B', 2: 'C', 1: 'D' };

    // 1問ずつの並びにする
    const QUESTIONS = ABILITIES.flatMap((ab, ai) => ab.items.map(it => ({ ...it, ai, ability: ab.name, growth: !!ab.growth })));

    // 平均点（小数第2位）→ A〜E
    function gradeOf(avg) {
      if (avg >= 3.5) return 'A';
      if (avg >= 2.5) return 'B';
      if (avg >= 1.5) return 'C';
      if (avg >= 0.5) return 'D';
      return 'E';
    }

    // ── 画面の制御 ─────────────────────────────
    const $ = id => document.getElementById(id);
    let answers = [];
    let last = null;

    $('totalCount').textContent = QUESTIONS.length;
    $('startBtn').addEventListener('click', start);
    $('backBtn').addEventListener('click', () => { answers.length ? (answers.pop(), renderQuestion()) : show('start'); });
    $('retryBtn').addEventListener('click', () => { answers = []; show('start'); window.scrollTo(0, 0); });
    $('copyBtn').addEventListener('click', copyResult);
    $('downloadBtn').addEventListener('click', downloadPng);

    function show(id) { for (const s of ['start', 'quiz', 'result']) $(s).hidden = s !== id; }

    function start() { answers = []; show('quiz'); renderQuestion(); }

    function renderQuestion() {
      const i = answers.length;
      const q = QUESTIONS[i];
      $('progressBar').style.width = `${i / QUESTIONS.length * 100}%`;
      $('qAbility').textContent = `${q.ai + 1}．${q.ability}`;
      $('qCount').textContent = `${i + 1} / ${QUESTIONS.length}`;
      $('qName').textContent = q.n;
      $('qDesc').textContent = q.d;
      const criteria = q.c || COMMON;
      const scores = [4, 3, 2, 1, 0].filter(s => criteria[s]);
      $('choices').replaceChildren(...scores.map(s => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'choice';
        b.innerHTML = `<span class="choice-score">${s}点${q.growth ? `<small>${GROWTH_GRADE[s]}</small>` : ''}</span><span class="choice-text"></span>`;
        b.querySelector('.choice-text').textContent = criteria[s];
        b.addEventListener('click', () => {
          answers.push(s);
          answers.length === QUESTIONS.length ? renderResult() : renderQuestion();
        });
        return b;
      }));
      window.scrollTo(0, 0);
    }

    function compute() {
      return ABILITIES.map((ab, ai) => {
        const scores = QUESTIONS.map((q, qi) => q.ai === ai ? answers[qi] : null).filter(v => v !== null);
        if (ab.growth) return { name: ab.name, score: `${scores[0]}／4`, grade: GROWTH_GRADE[scores[0]], scores };
        const avg = Math.round(scores.reduce((a, b) => a + b, 0) / scores.length * 100) / 100;
        return { name: ab.name, score: avg.toFixed(2), grade: gradeOf(avg), scores };
      });
    }

    function renderResult() {
      const results = compute();
      last = { results };
      $('rTable').replaceChildren(...results.map((r, ai) => {
        const tr = document.createElement('tr');
        const detail = ABILITIES[ai].items.map((it, k) => `${it.n} ${r.scores[k]}`).join(' / ');
        tr.innerHTML = `<td><span class="ab"></span><span class="detail"></span></td><td class="num">${r.score}</td><td class="grade">${r.grade}</td>`;
        tr.querySelector('.ab').textContent = r.name;
        tr.querySelector('.detail').textContent = detail;
        return tr;
      }));
      renderRing($('chart'), results.map(r => ({ name: r.name, grade: r.grade })));
      $('message').textContent = '';
      show('result');
      window.scrollTo(0, 0);
    }

    async function copyResult() {
      const text = [
        '【NAFT Mars Rover 能力判定】',
        ...last.results.map(r => `${r.name}：${r.grade}（${r.score}）`),
      ].join('\n');
      try { await navigator.clipboard.writeText(text); $('message').textContent = 'コピーしました'; }
      catch { $('message').textContent = 'コピーできませんでした'; }
    }

    // ── ステータスリング描画 ─────────────────────────────
    const ranks = { A: 1, B: .8, C: .6, D: .4, E: .2 };
    const ns = 'http://www.w3.org/2000/svg';
    function el(tag, attrs = {}, text) { const n = document.createElementNS(ns, tag); for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, String(v)); if (text !== undefined) n.textContent = text; return n }
    function polar(r, deg) { const a = (deg - 90) * Math.PI / 180; return [300 + Math.cos(a) * r, 300 + Math.sin(a) * r] }

    function renderRing(svg, values) {
      function line(x1, y1, x2, y2, width = 1.5, color = '#131313', opacity = 1) { svg.append(el('line', { x1, y1, x2, y2, stroke: color, 'stroke-width': width, 'stroke-opacity': opacity })) }
      function text(x, y, value, size = 26, weight = 600, rotation = 0, anchor = 'middle') { const n = el('text', { x, y, 'text-anchor': anchor, 'dominant-baseline': 'middle', 'font-family': 'Arial, Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif', 'font-size': size, 'font-weight': weight, fill: '#111', transform: rotation ? `rotate(${rotation} ${x} ${y})` : '' }, value); svg.append(n); return n }

      svg.replaceChildren();
      svg.append(el('rect', { width: 600, height: 600, fill: '#fff', 'data-bg': '' }));
      const count = values.length;
      for (let i = 0; i < 24; i++) { const p = polar(267, i * 15), q = polar(288, i * 15); line(...p, ...q, 11) }
      svg.append(el('circle', { cx: 300, cy: 300, r: 288, fill: 'none', stroke: '#111', 'stroke-width': 4 }));
      svg.append(el('circle', { cx: 300, cy: 300, r: 267, fill: 'none', stroke: '#111', 'stroke-width': 1.7 }));
      const pts = values.map((v, i) => polar(161 * ranks[v.grade], i * 360 / count));
      svg.append(el('polygon', { points: pts.map(p => p.join(',')).join(' '), fill: '#ff6500' }));
      for (let i = 0; i < count; i++) { const p = polar(161, i * 360 / count); line(300, 300, ...p, i === 0 ? 1.8 : 1.3, '#111', i === 0 ? 1 : .55) }
      svg.append(el('circle', { cx: 300, cy: 300, r: 161, fill: 'none', stroke: '#111', 'stroke-width': 2.5 }));
      for (let i = 0; i < count; i++) { for (let j = 1; j <= 5; j++) { const a = i * 360 / count * Math.PI / 180, p = polar(j * 32.2, i * 360 / count), dx = Math.cos(a) * 5, dy = Math.sin(a) * 5; line(p[0] - dx, p[1] - dy, p[0] + dx, p[1] + dy, 1.1, '#111', i === 0 ? 1 : .6) } }
      ['E', 'D', 'C', 'B', 'A'].forEach((grade, j) => { const p = polar((j + 1) * 32.2, 0); text(p[0] + 13, p[1], grade, 17, 500, 0, 'start') });
      values.forEach((v, i) => {
        const angle = i * 360 / count;
        const [x, y] = polar(246, angle);
        const rot = ((angle + 90) % 180) - 90;
        const slot = 2 * Math.PI * 246 / count * .78;
        const size = Math.max(12, Math.min(24, Math.floor(slot / Math.max(v.name.length, 1))));
        const label = text(x, y, v.name, size, 500, rot);
        if (label.getComputedTextLength() > slot) { label.setAttribute('textLength', slot); label.setAttribute('lengthAdjust', 'spacingAndGlyphs') }
        const [gx, gy] = polar(207, angle);
        text(gx, gy, v.grade, count > 8 ? 36 : 41, 750);
      });
      svg.setAttribute('aria-label', `ステータス。${values.map(v => `${v.name} ${v.grade}`).join('、')}`);
    }

    async function downloadPng() {
      try {
        const clone = $('chart').cloneNode(true);
        clone.setAttribute('width', '1200'); clone.setAttribute('height', '1200');
        clone.querySelector('[data-bg]')?.remove(); // 背景を外して透過PNGにする
        const source = new XMLSerializer().serializeToString(clone);
        const url = URL.createObjectURL(new Blob([source], { type: 'image/svg+xml;charset=utf-8' }));
        const img = new Image();
        await new Promise((resolve, reject) => { img.onload = resolve; img.onerror = reject; img.src = url });
        const canvas = document.createElement('canvas');
        canvas.width = 1200; canvas.height = 1200;
        canvas.getContext('2d').drawImage(img, 0, 0, 1200, 1200);
        URL.revokeObjectURL(url);
        const png = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
        if (!png) throw new Error('PNGを生成できませんでした');
        const a = document.createElement('a');
        a.href = URL.createObjectURL(png);
        a.download = 'ステータス.png';
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 30000);
        $('message').textContent = 'PNGを保存しました';
      } catch (e) {
        $('message').textContent = '保存できませんでした。もう一度お試しください。';
      }
    }
  })();
  </script>
</body>
</html>
